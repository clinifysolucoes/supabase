# Flyway config - LOCAL (Postgres em Docker com stubs do Supabase, ou `supabase start`)
# https://documentation.red-gate.com/flyway/configuration/parameters
#
# Conexao SEMPRE por variaveis de ambiente (Flyway le nativamente):
#   FLYWAY_URL=jdbc:postgresql://host.docker.internal:54329/postgres
#   FLYWAY_USER=postgres
#   FLYWAY_PASSWORD=postgres
# Nunca escreva credenciais neste arquivo.

# === Localizacao das migrations ===
# Ambas as pastas sao GERADAS por flyway/scripts/generate-repeatables.sh (gitignored).
# Source of truth: Procedures/BAD/*.pgs e Scripts/YYYY/MM/V*.sql.
# - flyway/staged-scripts/ -> V*.sql versionadas (copia 1-pra-1 de Scripts/)
# - flyway/repeatable/     -> R__*.sql repeatables (de Procedures/**/*.pgs + comentarios do dicionario)
flyway.locations=filesystem:flyway/staged-scripts,filesystem:flyway/repeatable,filesystem:flyway/callbacks

# === Naming ===
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# === Schemas ===
# flyway_schema_history fica em public (defaultSchema). O schema ad e criado pela
# V20261013_1000 (create schema if not exists); createSchemas=false para o Flyway
# nao cria-lo antes (evita o aviso "schema ad already exists").
flyway.defaultSchema=public
flyway.schemas=public,ad,private
flyway.createSchemas=false

# === Encoding ===
# Supabase e UTF-8 (server_encoding=UTF8): nao existe conversao de encoding.
# Arquivos sempre UTF-8 sem BOM.
flyway.encoding=UTF-8

# === Baseline ===
# Projeto Supabase novo: public pode nao estar vazio (objetos do proprio Supabase).
# baselineOnMigrate=true com versao 0 cria a schema_history e aplica TODAS as
# versionadas (todas sao > 0). Nunca marca nada como ja aplicado.
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Empty baseline (Supabase project)

# === Comportamento ===
flyway.outOfOrder=true
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true
# Corpos PL/pgSQL podem conter '${...}' literal; nao e placeholder Flyway.
flyway.placeholderReplacement=false
# clean dropa schemas inteiros. Desabilitado em TODOS os ambientes.
flyway.cleanDisabled=true

# === Historico ===
flyway.table=flyway_schema_history
