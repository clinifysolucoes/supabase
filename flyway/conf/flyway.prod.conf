# Flyway config - PRODUCTION (projeto Supabase de producao, branch main)
# https://documentation.red-gate.com/flyway/configuration/parameters
#
# Conexao SEMPRE por variaveis de ambiente, montadas pelo workflow a partir dos
# GitHub vars/secrets do environment "production" (com required reviewers):
#   FLYWAY_URL=jdbc:postgresql://<SUPABASE_DB_HOST>:<SUPABASE_DB_PORT>/postgres?sslmode=require
#   FLYWAY_USER=postgres.<project-ref>
#   FLYWAY_PASSWORD=<senha do banco>
# NUNCA commitar credenciais de producao.
#
# Supabase: pooler em modo SESSION (5432), usuario postgres.<project-ref>, sslmode=require.

flyway.locations=filesystem:flyway/staged-scripts,filesystem:flyway/repeatable,filesystem:flyway/callbacks

flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

flyway.defaultSchema=public
flyway.schemas=public,ad,private
flyway.createSchemas=false

flyway.encoding=UTF-8

flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Empty baseline (Supabase project)

# === Comportamento (conservador em prod) ===
# outOfOrder=true: PRs mergeados fora da ordem cronologica do timestamp do filename.
flyway.outOfOrder=true
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true
flyway.placeholderReplacement=false
flyway.cleanDisabled=true

flyway.table=flyway_schema_history
