# Deploy SQL no projeto Supabase de STAGING via Flyway (Docker) direto do runner.
#
# Trigger:
#   - push em staging (= PR mergeado em staging): info + repair + migrate
#     (repair reconcilia a schema_history quando uma repeatable foi removida)
#   - workflow_dispatch: escolha do comando (info | migrate | validate | repair)
#
# Pre-requisitos - GitHub environment "staging":
#   Variable SUPABASE_DB_HOST      -> host do POOLER (ex.: aws-0-sa-east-1.pooler.supabase.com)
#   Variable SUPABASE_DB_PORT      -> 5432 (modo SESSION; nunca 6543)
#   Variable SUPABASE_DB_USER      -> postgres.<project-ref>
#   Secret   SUPABASE_DB_PASSWORD  -> senha do banco (Project Settings > Database)
#
# Por que o pooler: runner do GitHub so tem IPv4; a conexao direta
# db.<ref>.supabase.co e IPv6 sem o add-on. O pooler em modo session aceita
# prepared statements, que o Flyway usa.

name: Deploy SQL -> staging

on:
  push:
    branches: [staging]
    paths:
      - 'Procedures/**'
      - 'Scripts/**'
      - 'docs/dictionary/schema.json'
      - 'flyway/**'
      - 'tools/**'
      - '.github/workflows/sql-deploy-staging.yml'
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando Flyway'
        required: true
        type: choice
        default: migrate
        options: [info, migrate, validate, repair]

permissions:
  contents: read

concurrency:
  group: sql-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLYWAY_URL: jdbc:postgresql://${{ vars.SUPABASE_DB_HOST }}:${{ vars.SUPABASE_DB_PORT }}/postgres?sslmode=require
      FLYWAY_USER: ${{ vars.SUPABASE_DB_USER }}
      FLYWAY_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Valida configuracao do environment
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [ -n "${{ vars.SUPABASE_DB_HOST }}" ]       || fail "vars.SUPABASE_DB_HOST vazio"
          [ -n "${{ vars.SUPABASE_DB_PORT }}" ]       || fail "vars.SUPABASE_DB_PORT vazio (use 5432)"
          [ "${{ vars.SUPABASE_DB_PORT }}" != "6543" ] || fail "porta 6543 (transaction mode) nao serve para Flyway; use 5432"
          [ -n "${{ vars.SUPABASE_DB_USER }}" ]       || fail "vars.SUPABASE_DB_USER vazio (postgres.<project-ref>)"
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ] || fail "secrets.SUPABASE_DB_PASSWORD vazio"
          echo "config ok"

      - name: Padroes do projeto
        run: |
          chmod +x flyway/scripts/*.sh
          flyway/scripts/validate-standards.sh

      - name: Gera flyway/repeatable e flyway/staged-scripts
        run: flyway/scripts/generate-repeatables.sh

      - name: Flyway
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CMDS="info repair migrate"
          else
            CMDS="info ${{ github.event.inputs.command }}"
          fi
          echo "flyway $CMDS"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway:11 -configFiles=flyway/conf/flyway.staging.conf $CMDS
